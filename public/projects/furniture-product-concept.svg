  <text x="104" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A7670">Каталог / Гостиная / Кресла</text>

  <!-- Product image -->
  <rect x="104" y="200" width="680" height="620" fill="url(#room2)"/>
  <!-- Interior setting -->
  <rect x="104" y="620" width="680" height="200" fill="#CFC5B8"/>
  <line x1="104" y1="620" x2="784" y2="620" stroke="#BEB3A5" stroke-width="2"/>
  <rect x="560" y="280" width="160" height="220" fill="#F3EFE9" opacity="0.7"/>
  <rect x="564" y="284" width="152" height="212" fill="none" stroke="#D4CCC0" stroke-width="5"/>
  <!-- Chair large -->
  <g>
    <path d="M260 640 C250 540, 270 440, 330 410 C400 375, 510 375, 570 410 C630 440, 650 540, 640 640 Z" fill="url(#fabric2)"/>
    <path d="M285 490 C300 435, 355 415, 450 415 C545 415, 600 435, 615 490 L600 530 C545 505, 355 505, 300 530 Z" fill="#B89578"/>
    <rect x="275" y="620" width="350" height="50" rx="10" fill="url(#fabric2)"/>
