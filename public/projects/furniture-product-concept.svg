    <path d="M270 520 C250 530, 245 570, 260 620 L285 615 C275 570, 280 540, 295 525 Z" fill="#B08D70"/>
    <path d="M630 520 C650 530, 655 570, 640 620 L615 615 C625 570, 620 540, 605 525 Z" fill="#B08D70"/>
    <!-- Legs -->
    <rect x="305" y="668" width="16" height="72" rx="4" fill="#7A583D"/>
    <rect x="579" y="668" width="16" height="72" rx="4" fill="#7A583D"/>
    <rect x="320" y="690" width="260" height="10" rx="3" fill="#8B6547" opacity="0.35"/>
    <!-- Cushion -->
    <ellipse cx="450" cy="590" rx="75" ry="28" fill="#D2BCA5" opacity="0.55"/>
