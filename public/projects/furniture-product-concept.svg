  <!-- Thumbnails -->
  <rect x="104" y="844" width="110" height="80" fill="#EBE6DF" stroke="#191919" stroke-width="1.5"/>
  <rect x="134" y="860" width="50" height="48" rx="4" fill="#CDB89F"/>
  <rect x="226" y="844" width="110" height="80" fill="#F5F4F1"/>
  <rect x="256" y="862" width="50" height="44" rx="4" fill="#D4C4B3"/>
  <rect x="348" y="844" width="110" height="80" fill="#F5F4F1"/>
  <rect x="382" y="860" width="42" height="48" rx="2" fill="#CFC0AE"/>

  <!-- Product info -->
  <text x="844" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A7670" letter-spacing="1.2">NORD HOME</text>
  <text x="844" y="290" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="500" fill="#191919" letter-spacing="-0.8">Кресло Luno</text>
  <text x="844" y="336" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#191919">250 000 ₸</text>

  <line x1="844" y1="370" x2="1336" y2="370" stroke="#E5E2DC"/>

  <text x="844" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A7670" letter-spacing="1">МАТЕРИАЛ</text>
  <text x="844" y="436" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#191919">Дуб, рогожка</text>

  <text x="844" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A7670" letter-spacing="1">РАЗМЕР</text>
  <text x="844" y="512" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#191919">82 × 76 × 74 см</text>

  <text x="844" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A7670" letter-spacing="1">ОПИСАНИЕ</text>
  <text x="844" y="592" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F5D59">Кресло с мягкой посадкой и опорой</text>
  <text x="844" y="618" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F5D59">для спины. Каркас из массива дуба,</text>
  <text x="844" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F5D59">обивка из износостойкой рогожки.</text>

  <line x1="844" y1="690" x2="1336" y2="690" stroke="#E5E2DC"/>

  <rect x="844" y="726" width="240" height="52" fill="#191919"/>
  <text x="964" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">Добавить в корзину</text>
  <rect x="1100" y="726" width="140" height="52" fill="none" stroke="#D9D5CF"/>
  <text x="1170" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#191919">В шоурум</text>

  <text x="844" y="830" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Доставка по Казахстану · Оплата при получении</text>
