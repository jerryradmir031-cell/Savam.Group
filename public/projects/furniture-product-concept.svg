    </linearGradient>
    <linearGradient id="fabric2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#C4A485"/>
      <stop offset="100%" stop-color="#927055"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="1024" fill="#FFFFFF"/>
  <rect x="56" y="56" width="1328" height="912" fill="#FFFFFF" stroke="#E5E2DC"/>

  <!-- Nav -->
  <line x1="56" y1="128" x2="1384" y2="128" stroke="#EAE7E1"/>
  <text x="104" y="99" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#191919" letter-spacing="0.5">NORD</text>
  <text x="168" y="99" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#191919" letter-spacing="0.5">HOME</text>
  <text x="760" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Каталог</text>
  <text x="850" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Коллекции</text>
  <text x="960" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Шоурум</text>
