<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F4F1"/>
      <stop offset="100%" stop-color="#EBE8E2"/>
    </linearGradient>
    <linearGradient id="chair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#C8A98A"/>
      <stop offset="100%" stop-color="#8B6A4B"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#D9C7B5"/>
      <stop offset="100%" stop-color="#B89C83"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9926E"/>
      <stop offset="100%" stop-color="#7A583D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#191919" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="#FFFFFF"/>
  <!-- Browser-like site frame -->
  <rect x="56" y="56" width="1328" height="912" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1"/>
  <!-- Top nav -->
  <rect x="56" y="56" width="1328" height="72" fill="#FFFFFF"/>
  <line x1="56" y1="128" x2="1384" y2="128" stroke="#EAE7E1"/>
  <text x="104" y="99" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#191919" letter-spacing="0.5">NORD</text>
  <text x="168" y="99" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#191919" letter-spacing="0.5">HOME</text>
  <text x="760" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Каталог</text>
  <text x="850" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Коллекции</text>
  <text x="960" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">Шоурум</text>
  <text x="1050" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">О бренде</text>
  <rect x="1210" y="76" width="126" height="36" fill="#191919"/>
  <text x="1273" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF">В каталог</text>

  <!-- Hero area -->
  <rect x="56" y="128" width="1328" height="560" fill="url(#heroBg)"/>
  <!-- Interior photo area -->
  <rect x="700" y="128" width="684" height="560" fill="#DDD5CA"/>
  <!-- Wall -->
  <rect x="700" y="128" width="684" height="360" fill="#E8E1D8"/>
  <!-- Floor -->
  <rect x="700" y="488" width="684" height="200" fill="#CBBBAA"/>
  <line x1="700" y1="488" x2="1384" y2="488" stroke="#B8A796" stroke-width="2"/>
  <!-- Window light -->
  <rect x="1060" y="170" width="220" height="260" fill="#F3EFE9" opacity="0.85"/>
  <rect x="1065" y="175" width="210" height="250" fill="none" stroke="#D4CCC0" stroke-width="8"/>
  <line x1="1170" y1="175" x2="1170" y2="425" stroke="#D4CCC0" stroke-width="6"/>
  <line x1="1065" y1="300" x2="1275" y2="300" stroke="#D4CCC0" stroke-width="6"/>
  <!-- Side table -->
  <rect x="1140" y="430" width="110" height="10" rx="2" fill="url(#wood)"/>
  <rect x="1155" y="440" width="10" height="70" fill="#8B6547"/>
  <rect x="1225" y="440" width="10" height="70" fill="#8B6547"/>
  <!-- Vase -->
  <ellipse cx="1195" cy="420" rx="16" ry="6" fill="#9C9186"/>
  <path d="M1183 420 C1180 400, 1185 385, 1195 382 C1205 385, 1210 400, 1207 420 Z" fill="#AFA59A"/>
  <!-- Chair -->
  <g filter="url(#shadow)">
    <path d="M820 470 C815 400, 825 330, 860 310 C900 290, 980 290, 1020 310 C1055 330, 1065 400, 1060 470 Z" fill="url(#fabric)"/>
    <path d="M835 360 C845 320, 880 305, 940 305 C1000 305, 1035 320, 1045 360 L1035 390 C1000 375, 880 375, 845 390 Z" fill="#CDB89F"/>
    <rect x="830" y="455" width="220" height="35" rx="8" fill="url(#fabric)"/>
    <rect x="845" y="488" width="14" height="58" rx="4" fill="#7A583D"/>
    <rect x="1021" y="488" width="14" height="58" rx="4" fill="#7A583D"/>
    <rect x="855" y="500" width="170" height="10" rx="3" fill="#8B6547" opacity="0.5"/>
  </g>

  <!-- Left content -->
  <text x="104" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A7670" letter-spacing="1.5">НОВАЯ КОЛЛЕКЦИЯ</text>
  <text x="104" y="300" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="600" fill="#191919" letter-spacing="-1">Тихая</text>
  <text x="104" y="368" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="600" fill="#191919" letter-spacing="-1">геометрия</text>
  <text x="104" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5F5D59">Мебель для гостиной, где форма, материал</text>
  <text x="104" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5F5D59">и свет работают вместе.</text>
  <rect x="104" y="490" width="168" height="48" fill="#191919"/>
  <text x="188" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF">Смотреть коллекцию</text>
  <text x="296" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#191919" text-decoration="underline">Все товары</text>

  <!-- Catalog strip -->
  <rect x="56" y="688" width="1328" height="280" fill="#FFFFFF"/>
  <text x="104" y="740" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#191919">В коллекции</text>
  <text x="1180" y="740" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5D59">6 предметов</text>
  <!-- Product cards -->
  <g>
    <rect x="104" y="770" width="290" height="150" fill="#F5F4F1"/>
    <rect x="145" y="795" width="208" height="100" rx="4" fill="#E5DDD3"/>
    <ellipse cx="249" cy="845" rx="55" ry="30" fill="#CDB89F"/>
    <rect x="220" y="865" width="58" height="18" rx="4" fill="#C4AD93"/>
    <text x="104" y="950" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#191919">Кресло Luno</text>
    <text x="104" y="970" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5F5D59">от 250 000 ₸</text>
  </g>
  <g>
    <rect x="418" y="770" width="290" height="150" fill="#F5F4F1"/>
    <rect x="459" y="800" width="208" height="90" rx="4" fill="#E5DDD3"/>
    <rect x="490" y="835" width="146" height="45" rx="4" fill="#BEA68D"/>
    <text x="418" y="950" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#191919">Диван Arco</text>
    <text x="418" y="970" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5F5D59">от 690 000 ₸</text>
  </g>
  <g>
    <rect x="732" y="770" width="290" height="150" fill="#F5F4F1"/>
    <rect x="773" y="800" width="208" height="90" rx="4" fill="#E5DDD3"/>
    <ellipse cx="877" cy="855" rx="60" ry="12" fill="#B9926E"/>
    <rect x="872" y="867" width="10" height="30" fill="#8B6547"/>
    <text x="732" y="950" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#191919">Стол Madera</text>
    <text x="732" y="970" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5F5D59">от 320 000 ₸</text>
  </g>
  <g>
    <rect x="1046" y="770" width="290" height="150" fill="#F5F4F1"/>
    <rect x="1087" y="800" width="208" height="90" rx="4" fill="#E5DDD3"/>
    <rect x="1155" y="815" width="72" height="75" rx="3" fill="#C8B49E"/>
    <text x="1046" y="950" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#191919">Комод Forma</text>
    <text x="1046" y="970" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5F5D59">от 410 000 ₸</text>
  </g>
</svg>
